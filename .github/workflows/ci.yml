name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

  integration-tests:
    name: Integration tests (zookeeper)
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for zookeeper
        run: |
          for i in $(seq 1 30); do
            (echo ruok; sleep 1) | nc localhost 2181 | grep -q imok && exit 0
            sleep 1
          done
          echo "zookeeper did not become ready in time" >&2
          exit 1

      - name: Run integration tests
        env:
          ZK_CONNECTION_STRING: localhost:2181
        run: pytest -q -m integration
